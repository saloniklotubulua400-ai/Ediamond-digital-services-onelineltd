<!-- OPTIONAL. Supabase > Authentication > Emails > Templates > "Reset password".
     Subject: Reset your Ediamond password
     Needs custom SMTP to edit. -->
<h2>Reset your Ediamond password</h2>
<p>We received a request to reset your password. Press the button below to choose a new one.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
      style="display:inline-block;background:#1d6bff;color:#ffffff;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:bold">Choose a new password</a></p>
<p>If you did not ask for this, you can ignore this email. Your password stays the same.</p>
