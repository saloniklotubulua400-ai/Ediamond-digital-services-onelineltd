<!-- OPTIONAL. Supabase > Authentication > Emails > Templates > "Confirm sign up".
     Subject: Confirm your Ediamond account
     Needs custom SMTP to edit. This version works on any device, not only the browser used to sign up. -->
<h2>Confirm your Ediamond account</h2>
<p>Thank you for signing up. Press the button below to confirm your email address.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/account"
      style="display:inline-block;background:#1d6bff;color:#ffffff;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:bold">Confirm my email</a></p>
<p>If you did not create an account, you can ignore this email.</p>
